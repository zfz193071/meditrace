# Render 部署配置
# 免费套餐：https://render.com/pricing

services:
  # 后端 FastAPI 服务
  - type: web
    name: meditrace-backend
    env: python
    region: oregon  # 美国西海岸，亚洲用户延迟约 150-200ms
    plan: free      # 免费套餐
    
    # 构建命令
    buildCommand: pip install -r src/backend/requirements.txt
    
    # 启动命令
    startCommand: cd src/backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    
    # 健康检查路径
    healthCheckPath: /docs
    
    # 环境变量
    envVars:
      # 数据库配置（SQLite 会持久化在 Render 的文件系统中）
      - key: DATABASE_URL
        value: sqlite:///./meditrace.db
      
      # DeepSeek API Key - 需要在 Render Dashboard 手动设置
      - key: DEEPSEEK_API_KEY
        sync: false
      
      # Ethereum Sepolia 配置
      - key: USE_SEPOLIA
        value: true
      - key: SEPOLIA_RPC_URL
        value: https://ethereum-sepolia-rpc.publicnode.com
      - key: CONTRACT_ADDRESS_SEPOLIA
        value: 0x860418e7713A346c829Bc539C93c7A2d576897C5
      
      # IPFS Pinata 配置 - 需要在 Render Dashboard 手动设置
      - key: PINATA_API_KEY
        sync: false
      - key: PINATA_SECRET_API_KEY
        sync: false
      - key: PINATA_JWT_TOKEN
        sync: false
      
      # CORS 配置 - 允许前端域名访问
      - key: CORS_ORIGINS
        value: https://meditrace.baozaolaoba.top,https://meditrace.vercel.app,http://localhost:3000
      
      # 其他配置
      - key: PYTHON_VERSION
        value: 3.11.0

# 注意：
# 1. 免费套餐的服务在 15 分钟无活动后会休眠，下次请求需要 30-60 秒冷启动
# 2. SQLite 数据库存储在 Render 的文件系统中，会持久化
# 3. 需要在 Render Dashboard 手动设置敏感环境变量（DEEPSEEK_API_KEY, PINATA_*)
