name: Referral foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    env:
      PYTHON_DOTENV_DISABLED: "1"
      DATABASE_URL: "sqlite:///:memory:"
      RR_ENVIRONMENT: test
      REAL_AI_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.3"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --project src/backend --frozen
      - run: python3 scripts/check_backend_lock.py
      - run: pnpm --dir src/frontend install --frozen-lockfile
      - run: python3 scripts/referral_contracts.py --check
      - run: src/backend/.venv/bin/python scripts/referral_fixtures.py --check
      - run: src/backend/.venv/bin/python -m pytest -q src/backend/tests/referral_review
      - run: python3 scripts/test_deploy_workflow.py
      - run: pnpm --dir src/frontend lint
      - run: pnpm --dir src/frontend test --runInBand
      - run: pnpm --dir src/frontend build
      - run: pnpm --dir src/frontend typecheck
      - run: pnpm --dir src/frontend audit --prod --audit-level=high --registry=https://registry.npmjs.org
      - run: src/backend/.venv/bin/pip-audit -r src/backend/requirements.txt --no-deps --disable-pip
  postgres-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: referral_test
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: referral_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U referral_test -d referral_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Ephemeral CI service only; no repository/production database secret needed.
      TEST_DATABASE_URL: postgresql://referral_test:disposable_ci_only@127.0.0.1:5432/referral_test
      PYTHON_DOTENV_DISABLED: "1"
      REAL_AI_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.3"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --project src/backend --frozen
      - name: Verify PostgreSQL migrations, storage, ledger, reviews and lifecycle races
        run: >-
          src/backend/.venv/bin/python -m pytest -q
          src/backend/tests/referral_review/test_persistence.py
          src/backend/tests/referral_review/test_pg_concurrency.py
          src/backend/tests/referral_review/test_document_pg.py
          src/backend/tests/referral_review/test_lifecycle_pg.py
          src/backend/tests/referral_review/test_usage.py
          src/backend/tests/referral_review/test_usage_pg.py
          src/backend/tests/referral_review/test_evaluation_ledger.py
          src/backend/tests/referral_review/test_evaluation_ledger_pg.py
          src/backend/tests/referral_review/test_evaluation_slots.py
          src/backend/tests/referral_review/test_evaluation_planning.py
          src/backend/tests/referral_review/test_evaluation_coordinator.py
          src/backend/tests/referral_review/test_evaluation_adjustments.py
          src/backend/tests/referral_review/test_evaluation_recovery.py
          src/backend/tests/referral_review/test_billing_pg.py
          src/backend/tests/referral_review/test_reviews_persistence.py
          src/backend/tests/referral_review/test_runs_pg.py
          src/backend/tests/referral_review/test_workflow_integration.py
          --junitxml=postgres-results.xml
      - name: Require executed PostgreSQL cases without skips
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse("postgres-results.xml").findall(".//testcase")
          assert cases, "PostgreSQL job produced no test cases"
          assert any("postgresql" in case.get("name", "") for case in cases), "PostgreSQL parametrization missing"
          assert not any(case.find("skipped") is not None for case in cases), "PostgreSQL acceptance cannot pass with skipped cases"
          print(f"Verified {len(cases)} executed cases with zero skips")
          PY
