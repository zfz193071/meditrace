[project]
name = "meditrace-backend"
version = "0.2.0"
description = "MediTrace backend and referral review foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.135,<1",
  "uvicorn[standard]>=0.41,<1",
  "pydantic>=2.13,<3",
  "python-dotenv>=1.2,<2",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.22,<1",
  "psycopg2-binary>=2.9.13,<3",
  "sqlalchemy>=2.0.54,<3",
  "alembic>=1.19,<2",
  "authlib>=1.9,<2",
  "requests>=2.32,<3",
  "cryptography>=50.0.2,<52",
  "fpdf2>=2.8.8,<3",
  "vercel-blob>=0.5.0,<0.6",
  "pypdf==6.21.2",
]

[dependency-groups]
dev = [
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.4,<2",
  "pip-audit>=2.10,<3",
  "reportlab>=4.4,<5",
  "pypdfium2>=5,<6",
]

[tool.uv]
package = false
required-version = "==0.13.3"

[tool.pytest.ini_options]
testpaths = ["tests/referral_review"]
pythonpath = ["."]
asyncio_mode = "auto"
